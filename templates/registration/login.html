{% extends 'base.html' %}
{% block title %}Quick Campus Feedback - Log In{% endblock %}

{% block content %}
  <h2>Log In</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log In</button>
  </form>
  <p>No account? <a href="{% url 'accounts:signup' %}">Sign up</a></p>
{% endblock %}
