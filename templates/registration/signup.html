{% extends 'base.html' %}
{% block title %}Quick Campus Feedback - Sign Up{% endblock %}

{% block content %}
  <h2>Create your account</h2>
  <p>Use your school email to register as a student.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign up</button>
  </form>
  <p>Already registered? <a href="{% url 'accounts:login' %}">Log in</a></p>
{% endblock %}
