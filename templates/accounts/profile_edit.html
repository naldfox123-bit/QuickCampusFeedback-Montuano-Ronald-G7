{% extends 'base.html' %}
{% block title %}Edit Profile{% endblock %}

{% block content %}
  <h2>Edit profile</h2>
  <form method="post" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
    <a href="{% url 'accounts:profile' %}">Cancel</a>
  </form>
{% endblock %}
